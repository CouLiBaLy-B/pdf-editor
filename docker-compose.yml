services:
  postgres:
    image: postgres:16-alpine
    container_name: pdf-editor-postgres
    environment:
      POSTGRES_USER: pdfpro
      POSTGRES_PASSWORD: pdfpro
      POSTGRES_DB: pdfpro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: pdf-editor-backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://pdfpro:pdfpro@postgres:5432/pdfpro}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - FROM_EMAIL=${FROM_EMAIL:-PDFPro <noreply@pdfpro.app>}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY:-}
      - R2_SECRET_KEY=${R2_SECRET_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - ADMIN_SECRET=${ADMIN_SECRET:-}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: pdf-editor-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
